<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CARV — Cut Accuracy Review and Verification</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0c0f;
            --surface: #111318;
            --surface2: #181c23;
            --surface3: #1e2330;
            --border: #252b38;
            --border2: #2e3547;
            --text: #dde3ef;
            --text-dim: #6b7591;
            --text-mid: #9ba3be;
            --accent: #e85d04;
            --accent2: #ff7a2f;
            --green: #2dd87a;
            --green-dim: rgba(45,216,122,.12);
            --red: #f24e4e;
            --red-dim: rgba(242,78,78,.12);
            --yellow: #f0b429;
            --yellow-dim: rgba(240,180,41,.1);
            --blue: #4d9ef7;
            --blue-dim: rgba(77,158,247,.1);
            --scribe: #58a6ff;
            --purple: #a78bfa;
            --radius: 6px;
            --mono: 'IBM Plex Mono', monospace;
            --sans: 'IBM Plex Sans', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 13px;
            min-height: 100vh;
            line-height: 1.5;
        }

        /* ── HEADER ── */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 28px;
            display: flex;
            align-items: center;
            gap: 0;
            height: 52px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-mark {
            font-family: var(--mono);
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 4px;
            margin-right: 16px;
        }

        .logo-sep {
            width: 1px;
            height: 20px;
            background: var(--border2);
            margin-right: 16px;
        }

        .logo-full {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hdr-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .hdr-version {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: .5px;
        }

        .hdr-pill {
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(232,93,4,.15);
            color: var(--accent2);
            border: 1px solid rgba(232,93,4,.3);
            letter-spacing: .5px;
        }

        /* ── LAYOUT ── */
        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 28px 24px 60px;
        }

        /* ── DROP ZONES ── */
        .drop-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 14px;
        }

        .drop-zone {
            border: 1px solid var(--border2);
            border-radius: var(--radius);
            padding: 28px 20px 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color .2s, background .2s, box-shadow .2s;
            background: var(--surface);
            position: relative;
            overflow: hidden;
        }

        .drop-zone::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(232,93,4,.04) 0%, transparent 60%);
            pointer-events: none;
        }

        .drop-zone:hover {
            border-color: var(--accent);
            background: var(--surface2);
            box-shadow: 0 0 0 1px rgba(232,93,4,.2);
        }

        .drop-zone.drag-over {
            border-color: var(--accent2);
            background: var(--surface2);
            box-shadow: 0 0 0 2px rgba(232,93,4,.3);
        }

        .drop-zone.loaded {
            border-color: var(--green);
            background: var(--surface2);
            box-shadow: 0 0 0 1px rgba(45,216,122,.15);
        }

        .drop-zone.loaded::before {
            background: linear-gradient(135deg, rgba(45,216,122,.05) 0%, transparent 60%);
        }

        .drop-zone input[type=file] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .dz-icon {
            font-size: 28px;
            margin-bottom: 10px;
            line-height: 1;
        }

        .dz-label {
